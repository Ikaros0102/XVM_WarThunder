[project]
name = "wt-xvm"
version = "0.1.0"
description = "War Thunder Tactical Overlay (WT-XVM)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rapidfuzz>=3.9.0",
    "mss>=9.0.1",
    "numpy>=1.26.0",
    "Pillow>=10.3.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pywebview>=5.1",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pyinstaller>=6.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
